name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Biome lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: biomejs/setup-biome@v2
        with:
          version: latest
      - run: biome check .

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Smoke test dev startup
        run: |
          LOG_FILE="$(mktemp)"
          set +e
          timeout 25s npm run dev >"$LOG_FILE" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 124 ]; then
            echo "Dev server started successfully (timeout reached as expected)."
            exit 0
          fi
          echo "Dev server exited prematurely with code $status:"
          cat "$LOG_FILE"
          exit 1
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci_placeholder
      - run: npm run build
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci_placeholder
